<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AI Student Task Manager</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <h1>
                🤖 AI Student Task Manager
            </h1>

            <button id="darkModeBtn"
                class="dark-mode-btn">

                🌙 Dark Mode

            </button>

        </div>


        <!-- Search Task -->
        <div class="search-section">

            <input type="text"
                id="searchTask"
                placeholder="🔍 Search Task...">

        </div>


        <!-- Task Input -->
        <div class="task-input-section">

            <!-- Task Name -->
            <input type="text"
                id="taskInput"
                placeholder="Enter your task...">

            <!-- Due Date -->
            <input type="date"
                id="dueDate">

            <!-- Priority -->
            <select id="priority">

                <option value="Low">
                    🟢 Low
                </option>

                <option value="Medium">
                    🟡 Medium
                </option>

                <option value="High">
                    🔴 High
                </option>

            </select>

            <!-- Add Task -->
            <button id="addTaskBtn">

                Add Task

            </button>

        </div>


        <!-- AI Features -->
        <div class="ai-section">

            <button id="aiSuggestBtn">

                ✨ AI Suggest Task

            </button>

            <button id="aiTipsBtn">

                🤖 Productivity Tip

            </button>

        </div>


        <!-- AI Result Box -->
        <div class="ai-box">

            <h3>
                AI Assistant
            </h3>

            <p id="aiResponse">

                AI suggestions will appear here...

            </p>

        </div>


        <!-- Progress -->
        <div class="progress-section">

            <p>
                Progress:
                <span id="progressText">
                    0%
                </span>
            </p>

            <div class="progress-bar">

                <div id="progressFill">

                </div>

            </div>

        </div>


        <!-- Counter -->
        <div class="task-counter">

            <span>
                Total:
                <strong id="totalTasks">
                    0
                </strong>
            </span>

            <span>
                Completed:
                <strong id="completedTasks">
                    0
                </strong>
            </span>

            <span>
                Pending:
                <strong id="pendingTasks">
                    0
                </strong>
            </span>

        </div>


        <!-- Filter -->
        <div class="filter-buttons">

            <button class="filter-btn active"
                data-filter="all">

                All

            </button>

            <button class="filter-btn"
                data-filter="completed">

                Completed

            </button>

            <button class="filter-btn"
                data-filter="pending">

                Pending

            </button>

        </div>


        <!-- Clear All -->
        <button id="clearAllBtn">

            🗑 Clear All Tasks

        </button>


        <!-- Task List -->
        <ul id="taskList"
            class="task-list">

        </ul>

    </div>


    <!-- JS -->
    <script src="config.js"></script>
    <script src="script.js"></script> 

</body>

</html>
