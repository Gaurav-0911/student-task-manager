<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <h1>
                📚 Student Task Manager
            </h1>

            <!-- Dark Mode -->
            <button id="darkModeBtn"
                class="dark-mode-btn">

                🌙 Dark Mode

            </button>

        </div>


        <!-- Search Task -->
        <div class="search-section">

            <input type="text"
                id="searchTask"
                placeholder="🔍 Search Task...">

        </div>


        <!-- Task Input Section -->
        <div class="task-input-section">

            <!-- Task Name -->
            <input type="text"
                id="taskInput"
                placeholder="Enter your task here...">


            <!-- Due Date -->
            <input type="date"
                id="dueDate">


            <!-- Priority -->
            <select id="priority">

                <option value="Low">
                    🟢 Low
                </option>

                <option value="Medium">
                    🟡 Medium
                </option>

                <option value="High">
                    🔴 High
                </option>

            </select>


            <!-- Add Button -->
            <button id="addTaskBtn">
                Add Task
            </button>

        </div>


        <!-- Progress Section -->
        <div class="progress-section">

            <p>
                Progress:
                <span id="progressText">
                    0%
                </span>
            </p>

            <div class="progress-bar">

                <div id="progressFill">

                </div>

            </div>

        </div>


        <!-- Task Counter -->
        <div class="task-counter">

            <span>
                Total:
                <strong id="totalTasks">
                    0
                </strong>
            </span>

            <span>
                Completed:
                <strong id="completedTasks">
                    0
                </strong>
            </span>

            <span>
                Pending:
                <strong id="pendingTasks">
                    0
                </strong>
            </span>

        </div>


        <!-- Filter Buttons -->
        <div class="filter-buttons">

            <button class="filter-btn active"
                data-filter="all">

                All

            </button>

            <button class="filter-btn"
                data-filter="completed">

                Completed

            </button>

            <button class="filter-btn"
                data-filter="pending">

                Pending

            </button>

        </div>


        <!-- Clear All -->
        <div class="clear-all-section">

            <button id="clearAllBtn">

                🗑 Clear All Tasks

            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList"
            class="task-list">

        </ul>

    </div>


    <!-- JS File -->
    <script src="script.js"></script>

</body>

</html>
